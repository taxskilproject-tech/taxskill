name: Estado operativo de producción
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  health:
    if: vars.H08_MONITOR_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: yarn
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn ops:check --cloud
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://gzwrqvqofcrdjvzoblaz.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          H08_OPERATION_ORGANIZATION_ID: ${{ vars.H08_OPERATION_ORGANIZATION_ID }}
          H08_OPERATION_MODE: ${{ vars.H08_OPERATION_MODE || 'production' }}
